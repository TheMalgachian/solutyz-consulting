<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
<title>Air-Tech</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Air-Tech : air comprimé, réseaux d'air, générateurs d'azote, gainage et récupération d'air chaud, compresseurs d'occasion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Mise en page : en-tête fixe (logo + onglets), une "fenêtre" par catégorie avec sous-onglets à gauche, aucune page qui défile */
:root{
  --blue:#0047a6;          /* bleu du logo */
  --blue-ink:#00357c;
  --blue-soft:#e8eef8;
  --bg:#f4f6fa;
  --surface:#ffffff;
  --fg:#14213a;
  --muted:#5a6680;
  --line:#d5dceb;
  --on-blue:#ffffff;
  --display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#2f74d6;--blue-ink:#8db6f0;--blue-soft:#13264a;--bg:#0a1222;--surface:#111c31;--fg:#e6ecf7;--muted:#9aa8c2;--line:#24344f;--on-blue:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#2f74d6;--blue-ink:#8db6f0;--blue-soft:#13264a;--bg:#0a1222;--surface:#111c31;--fg:#e6ecf7;--muted:#9aa8c2;--line:#24344f;--on-blue:#ffffff;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.wrap{width:100%;max-width:1180px;margin-inline:auto}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- Logo (couleurs fixes, toujours sur fond blanc) ---------- */
.logo{display:inline-flex;background:#fff;border:6px solid #0047a6;padding:10px 22px;text-decoration:none;flex:none}
.wordmark{font-family:var(--display);font-weight:500;color:#0047a6;font-size:28px;letter-spacing:.02em;line-height:1;display:inline-flex;align-items:stretch;position:relative}
.wordmark .t{display:inline-block}
.wordmark .lft{width:.55em;border-left:.075em solid currentColor;border-bottom:.075em solid currentColor;height:.42em;align-self:flex-end;margin-right:-.12em}
.wordmark .dash{width:.62em;align-self:center;border-top:.075em solid currentColor;margin:0 -.04em 0 .02em}
.wordmark .rgt{width:.55em;border-right:.075em solid currentColor;border-top:.075em solid currentColor;height:.42em;align-self:flex-start;margin-left:-.06em}

/* ---------- En-tête & onglets ---------- */
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:14px}
nav{flex:1;min-width:0;overflow-x:auto}
.tabs{display:flex;gap:4px;justify-content:flex-end;list-style:none;margin:0;padding:0}
.tab{border:1px solid transparent;background:none;color:var(--fg);font-family:var(--display);font-weight:500;font-size:15px;padding:9px 14px;white-space:nowrap;border-radius:2px}
.tab:hover{background:var(--blue-soft);color:var(--blue-ink)}
.tab[aria-selected="true"]{background:var(--blue);color:var(--on-blue)}

/* ---------- Fenêtre ---------- */
main{flex:1;min-height:0;display:flex}
.win{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--blue);box-shadow:0 10px 30px -18px rgba(0,40,100,.45)}
.bar{background:var(--blue);color:var(--on-blue);display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-weight:500;font-size:20px;margin:0;letter-spacing:.01em;text-wrap:balance}
.bar p{margin:0;opacity:.85;font-size:15px;flex:1;min-width:200px}
.bar .cta{margin-left:auto}
.cta{background:#fff;color:#0047a6;border:0;padding:8px 16px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border-radius:2px}
.cta:hover{background:#dfe8f6}
.cta.solid{background:var(--blue);color:var(--on-blue)}
.cta.solid:hover{background:var(--blue-ink);color:var(--surface)}

.body{flex:1;min-height:0;display:grid;grid-template-columns:230px 1fr}
.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:0 10px 8px}
.sub{text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--fg);padding:9px 12px;font-size:16px}
.sub:hover{background:var(--blue-soft)}
.sub[aria-selected="true"]{border-left-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.pane{padding:26px 32px;overflow:auto;min-width:0}
.pane h2{font-family:var(--display);font-weight:500;font-size:28px;margin:0 0 6px;color:var(--blue-ink);text-wrap:balance}
.pane .lead{font-size:18px;max-width:62ch;margin:0 0 20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px 32px;max-width:900px}
.cols h3{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.cols ul{margin:0;padding-left:18px;display:grid;gap:5px}
.spec{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 24px}
.spec span{border:1px solid var(--line);padding:4px 10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.spec b{color:var(--fg);font-weight:600}

/* Accueil */
.home{padding:26px 32px;overflow:auto;flex:1}
.home .lead{font-size:19px;max-width:60ch;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.tile:hover{border-color:var(--blue);background:var(--blue-soft)}
.tile strong{font-family:var(--display);font-weight:500;font-size:18px;color:var(--blue-ink)}
.tile small{color:var(--muted);font-size:14px}

/* Occasion */
table{border-collapse:collapse;width:100%;max-width:820px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin-bottom:10px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{font-size:13px;color:var(--muted)}

/* Contact */
.contact dl{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;margin:0 0 20px}
.contact dt{color:var(--muted)}
.contact dd{margin:0}

/* ---------- Fenêtre modale devis ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,15,35,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--surface);border:2px solid var(--blue);width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column}
.modal .bar button{background:none;border:0;color:var(--on-blue);font-size:22px;line-height:1;margin-left:auto;padding:2px 6px}
.modal form{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:auto}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.modal .full{grid-column:1/-1}
.modal input,.modal select,.modal textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:2px}
.modal textarea{min-height:90px;resize:vertical}
.ok{grid-column:1/-1;background:var(--blue-soft);color:var(--blue-ink);padding:10px 12px;font-size:14px}

footer{margin-top:10px;font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:760px){
  body{height:auto;min-height:100%}
  html{height:auto}
  nav{flex-basis:100%}
  .tabs{justify-content:flex-start}
  .body{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .side .lbl{display:none}
  .sub{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  .sub[aria-selected="true"]{border-bottom-color:var(--blue)}
  .pane,.home{padding:20px 16px}
  .modal form{grid-template-columns:1fr}
  .wordmark{font-size:23px}
}
@media (prefers-reduced-motion:no-preference){.pane,.home{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head><body>

<header class="wrap">
  <a class="logo" href="#accueil" aria-label="Air-Tech, accueil">
    <span class="wordmark"><span class="lft"></span><span class="t">AIR</span><span class="dash"></span><span class="t">TECH</span><span class="rgt"></span></span>
  </a>
  <nav aria-label="Catégories"><div class="tabs" role="tablist" id="tabs"></div></nav>
</header>

<main class="wrap"><section class="win" id="win" aria-live="polite"></section></main>

<footer class="wrap"><span>Air-Tech · Spécialiste de l'air comprimé</span><span>Vente · Installation · Maintenance · Réparation</span></footer>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="bar"><h1 id="mTitle">Demande de devis</h1><button type="button" id="mClose" aria-label="Fermer">×</button></div>
    <form id="devis">
      <label>Nom<input id="f-nom" required autocomplete="name"></label>
      <label>Société<input id="f-soc" autocomplete="organization"></label>
      <label>Téléphone<input id="f-tel" type="tel" autocomplete="tel"></label>
      <label>E-mail<input id="f-mail" type="email" required autocomplete="email"></label>
      <label>Catégorie<select id="f-cat"></select></label>
      <label>Prestation<select id="f-srv"></select></label>
      <label class="full">Votre besoin<textarea id="f-msg" placeholder="Ex. : compresseur à vis 15 kW, atelier de 400 m², besoin de 8 bar…"></textarea></label>
      <div class="full"><button class="cta solid" type="submit">Envoyer la demande</button></div>
      <p class="ok" id="ok" hidden>Votre demande est prête. L'envoi par e-mail sera activé lors de la mise en ligne du site.</p>
    </form>
  </div>
</div>

<script>
const CATS = [
 {id:"air-comprime", name:"Air comprimé", tag:"Compresseurs à vis, à pistons et sécheurs, du choix de la machine à son dépannage.",
  subs:[
   {id:"vente", name:"Vente", lead:"Nous dimensionnons le compresseur selon votre consommation réelle, pas selon un catalogue.",
    a:["Compresseurs à vis et à pistons","Vitesse fixe ou variable","Sécheurs frigorifiques et par adsorption","Cuves, filtres et purgeurs"],
    b:["Mesure ou estimation du débit consommé","Choix de la pression de service","Calcul du coût énergétique annuel","Offre chiffrée et délais"],
    spec:[["Pression","7 à 13 bar"],["Puissance","2,2 à 250 kW"],["Qualité d'air","ISO 8573-1"]]},
   {id:"installation", name:"Installation", lead:"Pose, raccordement et mise en service de votre centrale d'air comprimé.",
    a:["Implantation du local compresseur","Raccordement électrique et réseau","Évacuation des condensats","Ventilation du local"],
    b:["Visite technique sur site","Installation par nos techniciens","Mise en service et réglages","Prise en main par vos équipes"],
    spec:[["Livrables","Schéma de la centrale"],["Contrôle","Essais en charge"]]},
   {id:"maintenance", name:"Maintenance", lead:"Un entretien planifié pour éviter l'arrêt de production et maîtriser la consommation.",
    a:["Vidange et remplacement des filtres","Contrôle des séparateurs huile","Recherche de fuites","Contrôle des sécurités"],
    b:["Contrat annuel adapté au nombre d'heures","Visites planifiées","Rapport d'intervention après chaque visite","Suivi des heures de marche"],
    spec:[["Rythme courant","2 000 à 4 000 h"],["Fuites","Détection ultrasons"]]},
   {id:"remplacement", name:"Remplacement", lead:"Votre compresseur est en fin de vie ? Nous le remplaçons en limitant l'arrêt.",
    a:["Bilan de l'installation existante","Proposition d'une machine adaptée","Dépose et reprise de l'ancien matériel","Pose et mise en service"],
    b:["Comparatif de consommation avant / après","Intervention planifiée hors production","Location possible pendant les travaux"],
    spec:[["Objectif","Moins de kWh par m³"]]},
   {id:"reparation", name:"Réparation", lead:"Diagnostic et réparation de compresseurs toutes marques.",
    a:["Panne, alarme ou arrêt machine","Surchauffe et consommation d'huile","Perte de pression ou de débit","Remplacement de bloc vis ou de moteur"],
    b:["Appel et premier diagnostic","Intervention sur site ou en atelier","Devis avant réparation","Remise en service et essais"],
    spec:[["Marques","Toutes marques"]]}
  ]},
 {id:"reseau", name:"Réseau d'air", tag:"Distribution de l'air comprimé dans vos bâtiments, de la centrale au poste de travail.",
  subs:[
   {id:"installation", name:"Installation", lead:"Un réseau bien dimensionné réduit les pertes de charge et les fuites.",
    a:["Tubes aluminium à raccords rapides","Boucles et antennes","Descentes et prises d'air","Filtres-régulateurs aux points d'usage"],
    b:["Relevé des postes à alimenter","Calcul des diamètres","Pose du réseau","Essai d'étanchéité et réception"],
    spec:[["Diamètres","20 à 110 mm"],["Perte de charge visée","< 0,1 bar"]]}
  ]},
 {id:"azote", name:"Générateur d'azote", tag:"Produire votre azote sur site au lieu de louer des bouteilles.",
  subs:[
   {id:"installation", name:"Installation", lead:"Générateurs à membrane ou PSA, dimensionnés selon la pureté et le débit dont vous avez besoin.",
    a:["Découpe laser","Emballage alimentaire","Gonflage de pneumatiques","Inertage et soudure"],
    b:["Étude du besoin : pureté et débit","Choix membrane ou PSA","Installation et raccordement","Mise en service et analyse de pureté"],
    spec:[["Pureté","95 % à 99,999 %"],["Technologie","PSA / membrane"]]},
   {id:"diagnostic", name:"Diagnostic", lead:"Votre pureté baisse ou votre débit ne suffit plus ? Nous cherchons la cause.",
    a:["Mesure de la pureté et du débit","Contrôle de l'air d'alimentation","Contrôle des tamis et vannes","Lecture des alarmes"],
    b:["Intervention sur site","Rapport avec mesures","Préconisations chiffrées"],
    spec:[["Mesure","Analyseur O₂ résiduel"]]},
   {id:"remplacement", name:"Remplacement", lead:"Remplacement d'un générateur usé ou sous-dimensionné.",
    a:["Tamis moléculaire en fin de vie","Besoin d'une pureté plus élevée","Augmentation de la production","Passage bouteilles vers générateur"],
    b:["Bilan de l'existant","Proposition de remplacement","Dépose, pose et mise en service"],
    spec:[["Objectif","Coût par m³ d'azote"]]}
  ]},
 {id:"gainage", name:"Gainage & récupération d'air chaud", short:"Gainage / air chaud", tag:"Évacuer la chaleur du compresseur en été, la réutiliser en hiver.",
  subs:[
   {id:"installation", name:"Installation", lead:"Un compresseur transforme en chaleur la majeure partie de l'énergie qu'il consomme. Le gainage permet de la diriger où vous voulez.",
    a:["Gaine d'extraction de l'air chaud","Volet été / hiver","Chauffage d'un atelier ou d'un entrepôt","Ventilation du local compresseur"],
    b:["Mesure de la température du local","Calcul de la section de gaine","Pose de la gaine et des volets","Réglage et essais"],
    spec:[["Énergie récupérable","jusqu'à 90 %"],["Effet","Machine moins chaude, plus durable"]]}
  ]},
 {id:"occasion", name:"Occasion", tag:"Compresseurs d'occasion contrôlés et révisés dans notre atelier.",
  subs:[
   {id:"vente", name:"Vente", lead:"Une solution économique pour un besoin ponctuel, un atelier qui démarre ou une machine de secours.", occasion:true,
    a:["Contrôle complet en atelier","Remplacement des consommables","Essais avant livraison"],
    b:["Livraison et installation possibles","Reprise de votre ancien matériel","Stock mis à jour régulièrement"],
    spec:[]}
  ]},
 {id:"contact", name:"Contact", contact:true, tag:"Un projet, une panne, une question : écrivez-nous."}
];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let state = {cat:"accueil", sub:{}};

function renderTabs(){
  const all = [{id:"accueil",name:"Accueil"}, ...CATS];
  $("#tabs").innerHTML = all.map(c =>
    `<button class="tab" role="tab" id="tab-${c.id}" aria-selected="${c.id===state.cat}" data-cat="${c.id}">${esc(c.short||c.name)}</button>`).join("");
}

function render(){
  renderTabs();
  const w = $("#win");
  if(state.cat==="accueil"){
    w.innerHTML = `<div class="bar"><h1>Bienvenue chez Air-Tech</h1><p>Air comprimé, réseaux, azote et récupération de chaleur.</p><button class="cta" data-devis>Demander un devis</button></div>
    <div class="home"><p class="lead">Air-Tech vend, installe, entretient et répare vos équipements d'air comprimé. Choisissez une catégorie pour voir nos prestations.</p>
    <div class="grid">${CATS.filter(c=>!c.contact).map(c=>`<button class="tile" data-cat="${c.id}"><strong>${esc(c.name)}</strong><small>${c.subs.map(s=>esc(s.name)).join(" · ")}</small></button>`).join("")}</div></div>`;
    return;
  }
  const c = CATS.find(x=>x.id===state.cat);
  if(c.contact){
    w.innerHTML = `<div class="bar"><h1>Contact</h1><p>${esc(c.tag)}</p></div>
    <div class="home contact"><dl>
      <dt>Adresse</dt><dd>À compléter</dd><dt>Téléphone</dt><dd>À compléter</dd><dt>E-mail</dt><dd>À compléter</dd><dt>Zone d'intervention</dt><dd>À compléter</dd><dt>Horaires</dt><dd>À compléter</dd></dl>
      <button class="cta solid" data-devis>Demander un devis</button></div>`;
    return;
  }
  const sid = state.sub[c.id] || c.subs[0].id;
  const s = c.subs.find(x=>x.id===sid);
  w.innerHTML = `<div class="bar"><h1>${esc(c.name)}</h1><p>${esc(c.tag)}</p><button class="cta" data-devis>Demander un devis</button></div>
  <div class="body">
    <div class="side" role="tablist" aria-label="Prestations"><div class="lbl">Prestations</div>
      ${c.subs.map(x=>`<button class="sub" role="tab" aria-selected="${x.id===sid}" data-sub="${x.id}">${esc(x.name)}</button>`).join("")}</div>
    <div class="pane" role="tabpanel">
      <h2>${esc(s.name)}</h2><p class="lead">${esc(s.lead)}</p>
      ${s.occasion ? occasionTable() : ""}
      <div class="cols"><div><h3>${s.occasion?"Nos engagements":"Ce que nous traitons"}</h3><ul>${s.a.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>
      <div><h3>${s.occasion?"Services":"Déroulement"}</h3><ul>${s.b.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div></div>
      ${s.spec.length?`<div class="spec">${s.spec.map(([k,v])=>`<span>${esc(k)} : <b>${esc(v)}</b></span>`).join("")}</div>`:"<div style='height:22px'></div>"}
      <button class="cta solid" data-devis>Demander un devis – ${esc(s.name)}</button>
    </div></div>`;
}

function occasionTable(){
  const rows=[["Compresseur à vis","11 kW","10 bar","Révisé"],["Compresseur à vis + sécheur","22 kW","8 bar","Révisé"],["Compresseur à pistons","4 kW","10 bar","Révisé"]];
  return `<div class="tbl"><table><thead><tr><th>Matériel</th><th>Puissance</th><th>Pression</th><th>État</th></tr></thead><tbody>
  ${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <p class="note" style="margin:0 0 20px">Exemples de fiches : le stock réel est à renseigner.</p>`;
}

function go(cat, sub){
  state.cat = cat; if(sub) state.sub[cat]=sub;
  try{ history.replaceState(null,"","#"+cat); }catch(e){}
  render();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-cat],[data-sub],[data-devis]"); if(!t) return;
  if(t.dataset.devis!==undefined) return openDevis();
  if(t.dataset.cat) return go(t.dataset.cat);
  if(t.dataset.sub){ state.sub[state.cat]=t.dataset.sub; render(); }
});
document.querySelector('.logo').addEventListener("click", e=>{ e.preventDefault(); go("accueil"); });

/* ---------- Devis ---------- */
const fc=$("#f-cat"), fs=$("#f-srv");
fc.innerHTML = CATS.filter(c=>!c.contact).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
function fillSrv(){ const c=CATS.find(x=>x.id===fc.value); fs.innerHTML=c.subs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(""); }
fc.addEventListener("change", fillSrv);
function openDevis(){
  const c = CATS.find(x=>x.id===state.cat && !x.contact);
  fc.value = c ? c.id : CATS[0].id; fillSrv();
  if(c) fs.value = state.sub[c.id] || c.subs[0].id;
  $("#ok").hidden = true; $("#overlay").hidden = false; $("#f-nom").focus();
}
function closeDevis(){ $("#overlay").hidden = true; }
$("#mClose").addEventListener("click", closeDevis);
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeDevis(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDevis(); });
$("#devis").addEventListener("submit", e=>{ e.preventDefault(); $("#ok").hidden=false; });

const h = (location.hash||"").slice(1);
state.cat = [ "accueil", ...CATS.map(c=>c.id)].includes(h) ? h : "accueil";
render();
</script>
</body></html>
